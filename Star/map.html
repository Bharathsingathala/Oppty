<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Store Locator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img
            src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d3/Starbucks_Corporation_Logo_2011.svg/330px-Starbucks_Corporation_Logo_2011.svg.png"
            width="50"
          />
        </a>

        <div class="collapse navbar-collapse" id="navbar">
          <ul class="navbar-nav ms-4">
            <li class="nav-item">
              <a class="nav-link active fw-bold text-success" href="#">MENU</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-bold text-success" href="#">REWARDS</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-bold text-success" href="#">GIFT CARDS</a>
            </li>
          </ul>

          <div class="ms-auto d-flex align-items-center gap-3">
            <a href="#" class="text-dark text-decoration-none">
              <i class="bi bi-geo-alt-fill"></i>

              Find a Store
            </a>

            <button class="btn btn-outline-dark rounded-pill">Sign In</button>

            <button class="btn btn-dark rounded-pill">Join Now</button>
          </div>
        </div>
      </div>
    </nav>
    <section>
      <div class="container-fluid">
        <div class="row h-100">
          <!-- Left Side -->

          <div class="col-lg-4 bg-white p-5">
            <!-- Pickup & Delivery -->

            <div class="d-flex justify-content-center mb-5">
              <div class="btn-group w-75">
                <button class="btn btn-success rounded-start-pill fw-bold fs-4">
                  Pickup
                </button>

                <button
                  class="btn btn-outline-success rounded-end-pill fw-bold fs-4"
                >
                  Delivery
                </button>
              </div>
            </div>

            <!-- Search -->

            <div class="d-flex align-items-center mb-5">
              <div class="flex-grow-1 border-bottom">
                <div class="input-group input-group-lg border-0">
                  <input
                    type="text"
                    class="form-control border-0 shadow-none"
                    placeholder="Find a store"
                  />

                  <span class="input-group-text bg-white border-0">
                    <i class="bi bi-search fs-2"></i>
                  </span>
                </div>
              </div>

              <button
                class="btn btn-outline-success rounded-pill ms-3 px-4 fw-bold"
              >
                Filter
              </button>
            </div>

            <!-- Message -->

            <h1 class="display-4 mb-2">Zoomed out too far</h1>

            <p class="text-secondary">
              Try searching for a location or zooming in to see results.
            </p>

            <!-- Bottom Links -->

            <div class="position-absolute">
              <p>
                <a href="#" class="text-success text-decoration-none">
                  Privacy Notice
                </a>
              </p>

              <p>
                <a href="#" class="text-success text-decoration-none">
                  Terms of Use
                </a>
              </p>

              <p>
                <a href="#" class="text-success text-decoration-none">
                  Do Not Share My Personal Information
                </a>
              </p>
            </div>
          </div>

          <!-- Right Side -->

          <div class="col-lg-8 p-0">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3381.154156347138!2d77.69957017439768!3d13.015604187303744!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae11004fb30941%3A0x4e7932124eeae9c2!2sStarbucks!5e1!3m2!1sen!2sin!4v1785230665135!5m2!1sen!2sin"
              width="100%"
              height="100%"
              style="border: 0"
              allowfullscreen
              loading="lazy"
            >
            </iframe>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
