<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School ID Card</title>
    <link rel="stylesheet" href="school.css">
</head>
<body>

    <div class="id-card">
        <div class="header">
            <div class="logo">Oppty</div>
            <h1>Oppty Cricket Academy</h1>
        </div>

        <!-- Middle -->
        <div class="con">

            <!-- Photo -->
            <div class="photo">
                <img src="https://i.pinimg.com/originals/8a/94/4f/8a944fad7d782c1b8e6fae2d22815705.jpg"
                alt="Student">
            </div>

            <!-- Details -->
            <div class="details">

                <div class="row">
                    <h4>ID</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <div class="row">
                    <h4>Name</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <div class="row">
                    <h4>Class</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <div class="row">
                    <h4>D.O.B</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <div class="row">
                    <h4>Address</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <div class="row">
                    <h4>Phone</h4>
                    <div class="line"><input type="text"></div>
                </div>

                <!-- Footer -->
                <div class="bottom">

                    <div class="barcode">
                        ||||||||||||||||||||||||
                    </div>

                    <div class="sign">
                        <div class="line"><input type="text"></div>
                        <p>Principal</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
